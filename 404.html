<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Browser Memory Visualizer</title>
  <meta name="robots" content="noindex" />
    <link href="styles.css" rel="stylesheet" />
    <link href="css/dashboard.css" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg, #0a0a0f);
      color: var(--text, #f2f2f2);
    }
    .nf-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 12px;
    }
    .nf-code {
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 800;
      margin: 0;
      line-height: 1;
      color: var(--cyan, #22d3ee);
    }
    .nf-title {
      font-size: 1.25rem;
      margin: 0;
      font-weight: 600;
    }
    .nf-message {
      max-width: 42ch;
      opacity: 0.75;
      margin: 0;
    }
    .nf-link {
      margin-top: 12px;
      color: var(--cyan, #22d3ee);
      text-decoration: none;
      font-weight: 600;
      border: 1px solid currentColor;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
    }
    .nf-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="nf-wrap">
    <p class="nf-code">404</p>
    <h1 class="nf-title">Page not found</h1>
    <p class="nf-message">The page you're looking for doesn't exist or may have moved.</p>
    <a class="nf-link" href="index.html">&larr; Back to Browser Memory Visualizer</a>
  </main>
</body>
</html>
